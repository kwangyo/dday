<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>병영 디데이 표시</title>
<style>
body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; text-align:center; line-height:1.5; }
button { margin: 10px; padding:5px 10px; font-size:16px; cursor:pointer; }
#container { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px; }
.jsm-block { border:1px solid #aaa; padding:10px; border-radius:8px; width:350px; min-width:300px; text-align:center; }
canvas { background:#f0f0f0; border-radius:50%; display:block; margin:0 auto 10px; }
.field { margin-bottom:10px; }
.label { font-weight:bold; }
</style>
</head>
<body>

<h1>병영 디데이 표시</h1>

<button id="btn-seongmin">정승민 표시</button>
<button id="btn-namchan">남찬서 표시</button>

<div id="container"></div>

<script>
function pad(num){ return num<10?'0'+num:num; }
function zeroHourDate(str){
    const y=parseInt(str.slice(0,4));
    const m=parseInt(str.slice(4,6))-1;
    const d=parseInt(str.slice(6,8));
    return new Date(y,m,d,0,0,0);
}
function drawClock(canvasId,h,m,s){
    const canvas=document.getElementById(canvasId);
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    const radius=canvas.width/2;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath(); ctx.arc(radius,radius,radius-5,0,2*Math.PI); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(radius,radius,4,0,2*Math.PI); ctx.fillStyle='#333'; ctx.fill();
    ctx.font='14px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let n=1;n<=12;n++){ const ang=n*Math.PI/6;
        const x=radius+Math.sin(ang)*(radius-25), y=radius-Math.cos(ang)*(radius-25);
        ctx.fillText(n,x,y);}
    const secAng=(s/60)*2*Math.PI;
    const minAng=((m+s/60)/60)*2*Math.PI;
    const hourAng=((h%12+m/60)/12)*2*Math.PI;
    ctx.beginPath(); ctx.lineWidth=4; ctx.moveTo(radius,radius);
    ctx.lineTo(radius+Math.sin(hourAng)*(radius-50),radius-Math.cos(hourAng)*(radius-50)); ctx.strokeStyle='#000'; ctx.stroke();
    ctx.beginPath(); ctx.lineWidth=3; ctx.moveTo(radius,radius);
    ctx.lineTo(radius+Math.sin(minAng)*(radius-35),radius-Math.cos(minAng)*(radius-35)); ctx.strokeStyle='#000'; ctx.stroke();
    ctx.beginPath(); ctx.lineWidth=1.5; ctx.moveTo(radius,radius);
    ctx.lineTo(radius+Math.sin(secAng)*(radius-25),radius-Math.cos(secAng)*(radius-25)); ctx.strokeStyle='red'; ctx.stroke();
}

// --- 데이터 블록 생성 ---
function createJSM(id, traStr, disStr, name){
    if(document.getElementById(id)) return;

    const block=document.createElement('div');
    block.className='jsm-block';
    block.id=id;
    block.innerHTML=`
        <h2>${name} 병영 디데이</h2>
        <canvas id="clock-${id}" width="150" height="150"></canvas>
        <div id="jsm-content-${id}"></div>
        <button id="toggle-${id}">백분율 자세히</button>
    `;

    const container=document.getElementById('container');
    // 정승민은 항상 좌측, 남찬서는 우측
    if(id==='seongmin'){
        block.style.order=0;
        container.prepend(block);
    }else{
        block.style.order=1;
        container.appendChild(block);
    }

    let detailed=false;
    let updateInterval=1000;
    let intervalId=null;

    document.getElementById(`toggle-${id}`).addEventListener('click',()=>{
        detailed=!detailed;
        document.getElementById(`toggle-${id}`).textContent=detailed?"백분율 간단히":"백분율 자세히";
        clearInterval(intervalId);
        updateInterval=detailed?100:1000;
        intervalId=setInterval(calc,updateInterval);
    });

    const tra=zeroHourDate(traStr);
    const dis=zeroHourDate(disStr);
    const msPerDay=24*60*60*1000;

    function calc(){
        const now=new Date();
        const dur_now=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-tra)/msPerDay)+1;
        const dur_total=549;

        const totalSeconds=(dis-tra)/1000;
        const elapsedSeconds=(now-tra)/1000;
        const cent2=Math.min(Math.max((elapsedSeconds/totalSeconds*100),0),100);

        const cent2Str=detailed?cent2.toFixed(8):cent2.toFixed(2);
        const blocks2=Math.floor(cent2/10);
        const text2="⬛".repeat(blocks2)+"◻️".repeat(10-blocks2);

        const dday2=Math.ceil((dis-now)/msPerDay);

        let cent1=0;
        const sgt=zeroHourDate("20251101");
        if(now>=sgt){
            const totalSec=(dis-sgt)/1000;
            const elapsedSec=(now-sgt)/1000;
            cent1=Math.min(Math.max((elapsedSec/totalSec*100),0),100);
        }
        const cent1Str=detailed?cent1.toFixed(8):cent1.toFixed(2);
        const blocks1=Math.floor(cent1/10);
        const text1="⬛".repeat(blocks1)+"◻️".repeat(10-blocks1);

        const totalHours=((now-tra)/(dis-tra))*24;
        let clock_hour=Math.floor(totalHours);
        let clock_minute=Math.floor((totalHours-clock_hour)*60);
        let clock_second=Math.floor((((totalHours-clock_hour)*60)-clock_minute)*60);
        if(clock_hour>=24){clock_minute=0;clock_second=0;}

        document.getElementById(`jsm-content-${id}`).innerHTML=`
            <div class="field"><span class="label">계급:</span> 병장</div>
            <div class="field"><span class="label">전역 디데이:</span> ${dday2}</div>
            <div class="field"><span class="label">병장 백분율:</span> ${text1} ${cent1Str}%</div>
            <div class="field"><span class="label">군생활 백분율:</span> ${text2} ${cent2Str}% (${dur_now}/${dur_total})</div>
            <div class="field"><span class="label">국방부 시계:</span> ${pad(clock_hour)}시 ${pad(clock_minute)}분 ${pad(clock_second)}초</div>
            <div class="field"><span class="label">입영일:</span> ${tra.getFullYear()}년 ${tra.getMonth()+1}월 ${tra.getDate()}일</div>
            <div class="field"><span class="label">전역일:</span> ${dis.getFullYear()}년 ${dis.getMonth()+1}월 ${dis.getDate()}일</div>
        `;
        drawClock(`clock-${id}`,clock_hour,clock_minute,clock_second);
    }

    calc();
    intervalId=setInterval(calc,updateInterval);
}

// --- 버튼 이벤트 ---
document.getElementById('btn-seongmin').addEventListener('click',()=>{
    const btn=document.getElementById('btn-seongmin');
    if(btn.textContent.includes("표시")){
        createJSM('seongmin','20240805','20260204','정승민');
        btn.textContent="정승민 숨기기";
    }else{
        const block=document.getElementById('seongmin');
        if(block) block.remove();
        btn.textContent="정승민 표시";
    }
});

document.getElementById('btn-namchan').addEventListener('click',()=>{
    const btn=document.getElementById('btn-namchan');
    if(btn.textContent.includes("표시")){
        createJSM('namchan','20240819','20260218','남찬서');
        btn.textContent="남찬서 숨기기";
    }else{
        const block=document.getElementById('namchan');
        if(block) block.remove();
        btn.textContent="남찬서 표시";
    }
});
</script>

</body>
</html>
